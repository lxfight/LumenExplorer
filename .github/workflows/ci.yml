name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Clipboard, OLE, and window integration tests share Windows process state.
  RUST_TEST_THREADS: '1'

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (release)
        run: cargo build --release

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows Installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1 -SkipCargoBuild

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-installer-windows-x64
          path: |
            dist/LumenSetup-*-x64.exe
            dist/LumenSetup-*-x64.exe.sha256
          if-no-files-found: error
